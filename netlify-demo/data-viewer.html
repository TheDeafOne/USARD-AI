<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore and download USARD lab data" />
    <title>Data viewer | USARD Concepts</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/data-viewer.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <header class="viewer-topbar">
        <a class="back-link compact" href="index.html#data-heading">&#8592; All data</a>
        <p>USARD / Data explorer</p>
      </header>

      <section class="viewer-heading" aria-labelledby="dataset-title">
        <div>
          <p class="eyebrow">Dataset</p>
          <h1 id="dataset-title">Loading data&hellip;</h1>
          <p class="lede" id="dataset-description"></p>
        </div>
        <div class="viewer-actions">
          <button class="secondary-button" id="copy-url" type="button">Copy CSV URL</button>
          <a class="primary-button" id="download-csv" href="#" download>Download CSV</a>
        </div>
      </section>

      <section class="dataset-panel" aria-label="CSV data viewer">
        <div class="dataset-toolbar">
          <label class="search-field" for="table-search">
            <span class="search-icon" aria-hidden="true"></span>
            <span class="sr-only">Search this dataset</span>
            <input id="table-search" type="search" placeholder="Search every column&hellip;" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <p class="row-count" id="row-count" aria-live="polite">Loading&hellip;</p>
        </div>

        <div class="viewer-table-wrap" tabindex="0" aria-label="Scrollable data table">
          <table class="viewer-table" id="csv-table">
            <thead></thead>
            <tbody></tbody>
          </table>
          <div class="table-state" id="table-state" role="status">
            <span class="loader" aria-hidden="true"></span>
            <p>Reading CSV&hellip;</p>
          </div>
        </div>

        <footer class="dataset-footer">
          <p id="file-path"></p>
          <p>Click a column heading again to reverse or clear its sort</p>
        </footer>
      </section>
    </main>

    <script src="assets/data-viewer.js" defer></script>
  </body>
</html>
